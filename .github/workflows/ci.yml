# Runs the same local gate as scripts/check.sh: formatting, clippy -D warnings, every workspace
# test and the architecture rules. Real-data tests skip here (their env vars are never set in CI;
# the restricted data stays on the evaluation machine).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check.sh (fmt, clippy, tests, architecture rules)
    # Pinned to the image and toolchain the gate was last verified on, so a runner-image or
    # clippy upgrade never turns main red by itself; bump both deliberately.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Free disk space for the workspace build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # rustc needs about 6 GB for the generated desktop UI module (crates/shell-slint) and the
      # two-job build peaks near 12 GB; the 2-core runner has 7 GB of RAM, so without more swap
      # the runner is killed mid-build.
      - name: Add swap for the desktop UI compile
        run: |
          sudo fallocate -l 12G /swapfile-ci
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci
          sudo swapon /swapfile-ci
          free -h
          df -h /

      - uses: actions/checkout@v4

      - name: Install build dependencies (fontconfig for the desktop shell)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Gate
        run: ./scripts/check.sh

  windows:
    name: check.sh on Windows (MSVC)
    # Windows is the primary platform (spec §24.1). Same gate, same pinned toolchain.
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      # The Windows counterpart of the swap step above: rustc needs about 6 GB for the generated
      # desktop UI module, more than the 2-core runner's 7 GB of RAM can hold beside a second job.
      - name: Enlarge the pagefile for the desktop UI compile
        uses: al-cheb/configure-pagefile-action@a3b6ebd6b634da88790d9c58d4b37a7f4a7b8708 # v1.4
        with:
          minimum-size: 16GB
          maximum-size: 24GB
          disk-root: "C:"

      - name: Show the pagefile and free disk
        shell: pwsh
        run: |
          Get-CimInstance Win32_PageFileUsage | Format-List Name,AllocatedBaseSize,CurrentUsage
          Get-PSDrive -PSProvider FileSystem | Format-Table Name,Used,Free

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Gate
        shell: bash
        run: ./scripts/check.sh

      # .cargo/config.toml links the C runtime statically; prove it, since a clean Windows 11 PC
      # has no VCRUNTIME140.dll.
      - name: The executables need no Visual C++ runtime
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "no Visual Studio with the C++ tools" }
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found under $vs" }
          foreach ($exe in "target\debug\omr.exe", "target\debug\omr-desktop.exe") {
            if (-not (Test-Path $exe)) { throw "$exe was not built" }
            $deps = & $dumpbin.FullName /nologo /dependents $exe | Out-String
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed on $exe" }
            Write-Output $deps
            if ($deps -notmatch "(?i)KERNEL32\.dll") { throw "no import table read from $exe" }
            if ($deps -match "(?i)vcruntime|msvcp") { throw "$exe needs the Visual C++ runtime" }
          }

      # omr-winres embeds the app icon and version resource (no resource compiler): Explorer, the
      # taskbar and Task Manager show them.
      - name: The executables carry the Mizan icon and version information
        shell: pwsh
        run: |
          Add-Type -Namespace Win32 -Name Shell -MemberDefinition '[DllImport("shell32.dll", CharSet = CharSet.Unicode)] public static extern uint ExtractIconEx(string file, int index, System.IntPtr[] large, System.IntPtr[] small, uint n);'
          foreach ($pair in @(@("target\debug\omr.exe", "Mizan command line"), @("target\debug\omr-desktop.exe", "Mizan"))) {
            $exe = (Resolve-Path $pair[0]).Path
            $icons = [Win32.Shell]::ExtractIconEx($exe, -1, $null, $null, 0)
            $info = (Get-Item $exe).VersionInfo
            Write-Output "$exe : $icons icon(s), '$($info.FileDescription)' $($info.ProductName) $($info.FileVersion)"
            if ($icons -lt 1) { throw "$exe has no icon" }
            if ($info.FileDescription -ne $pair[1]) { throw "$exe FileDescription is '$($info.FileDescription)', expected '$($pair[1])'" }
            if ($info.ProductName -ne "Mizan") { throw "$exe ProductName is '$($info.ProductName)'" }
          }
