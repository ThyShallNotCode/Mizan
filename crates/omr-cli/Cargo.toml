[package]
name = "omr-cli"
description = "Headless command-line front end: sheets, simulation, grading, reports, benchmarks (spec §4.3, §16.4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "omr"
path = "src/main.rs"

[dependencies]
omr-app.workspace = true
omr-model.workspace = true
omr-forms = { workspace = true, features = ["render"] }
clap.workspace = true
serde_json.workspace = true
hex.workspace = true
rand.workspace = true
rayon.workspace = true

[dev-dependencies]
omr-sim.workspace = true
tempfile.workspace = true
serde_json.workspace = true
uuid.workspace = true
