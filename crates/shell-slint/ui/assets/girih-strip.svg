<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 10" width="32" height="10">
  <!-- Horizontal girih ornament for section dividers: a rule with an 8-point
       star every 32 px. Single colour; colourise at use site. Tiles in x. -->
  <g fill="none" stroke="#000000" stroke-width="1">
    <path d="M0 5 H11.5 M20.5 5 H32"/>
    <rect x="13" y="2" width="6" height="6"/>
    <rect x="13" y="2" width="6" height="6" transform="rotate(45 16 5)"/>
  </g>
</svg>
