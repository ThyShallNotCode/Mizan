<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Mizan</title>
  <!-- App mark: a level balance (mizan) whose pans are two filled answer bubbles, on the deep-teal
       plate, with an 8-point girih star as the pivot jewel (solid: an 8-point star with a central
       circle is the Rub el Hizb sign) and a faint girih star behind. Used from 48 px up; 16-40 px
       use the pixel-fitted drawings in brand/. examples/brand_icons.rs renders the .ico. -->
  <defs>
    <linearGradient id="bgM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14735F"/>
      <stop offset="1" stop-color="#0C463F"/>
    </linearGradient>
    <radialGradient id="glowM" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDC979"/>
      <stop offset="1" stop-color="#C38F3A"/>
    </linearGradient>
    <radialGradient id="panM" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#F6DA97"/>
      <stop offset="0.55" stop-color="#EDC979"/>
      <stop offset="1" stop-color="#C38F3A"/>
    </radialGradient>
    <filter id="shadowM" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgM)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#glowM)"/>
  <rect x="23" y="23" width="466" height="466" rx="105" fill="none" stroke="#2A8A7C" stroke-opacity="0.9" stroke-width="6"/>
  <path d="M256.00,74.00 L313.41,131.41 L394.59,131.41 L394.59,212.59 L452.00,270.00 L394.59,327.41 L394.59,408.59 L313.41,408.59 L256.00,466.00 L198.59,408.59 L117.41,408.59 L117.41,327.41 L60.00,270.00 L117.41,212.59 L117.41,131.41 L198.59,131.41 Z" fill="none" stroke="#F5F0E6" stroke-opacity="0.09" stroke-width="7" stroke-linejoin="round"/>
  <g filter="url(#shadowM)">
    <path d="M124 186 L88 262 M124 186 L160 262" fill="none" stroke="url(#goldM)" stroke-width="8" stroke-linecap="round"/>
    <path d="M388 186 L352 262 M388 186 L424 262" fill="none" stroke="url(#goldM)" stroke-width="8" stroke-linecap="round"/>
    <rect x="243" y="168" width="26" height="206" rx="13" fill="url(#goldM)"/>
    <rect x="204" y="360" width="104" height="24" rx="12" fill="url(#goldM)"/>
    <rect x="166" y="380" width="180" height="30" rx="15" fill="url(#goldM)"/>
    <rect x="100" y="173" width="312" height="24" rx="12" fill="url(#goldM)"/>
    <circle cx="124" cy="185" r="15" fill="url(#goldM)"/>
    <circle cx="388" cy="185" r="15" fill="url(#goldM)"/>
    <circle cx="124" cy="300" r="52" fill="url(#panM)" stroke="#A9782C" stroke-opacity="0.55" stroke-width="5"/>
    <circle cx="388" cy="300" r="52" fill="url(#panM)" stroke="#A9782C" stroke-opacity="0.55" stroke-width="5"/>
    <path d="M256.00,126.00 L268.30,138.30 L285.70,138.30 L285.70,155.70 L298.00,168.00 L285.70,180.30 L285.70,197.70 L268.30,197.70 L256.00,210.00 L243.70,197.70 L226.30,197.70 L226.30,180.30 L214.00,168.00 L226.30,155.70 L226.30,138.30 L243.70,138.30 Z" fill="url(#goldM)" stroke="#A9782C" stroke-opacity="0.45" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
