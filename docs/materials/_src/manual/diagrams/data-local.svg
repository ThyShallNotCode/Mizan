<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" role="img" aria-labelledby="data-local-title data-local-desc">
  <title id="data-local-title">Where Mizan keeps your exam data</title>
  <desc id="data-local-desc">Architecture: on your computer, Mizan writes each exam folder (a copy of every scanned page, the exports including the answer key, and a tamper-evident audit log of every decision) and keeps a private folder with the signing key and signed checkpoints that check the log; Mizan makes no network calls of its own and refuses cloud sync folders and network drives for exams (on Windows, only some of them so far); you share the grade upload and course report yourself.</desc>
  <defs><marker id="data-local-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55606E"/></marker><marker id="data-local-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0E5E57"/></marker><marker id="data-local-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3D5A80"/></marker></defs>
  <rect width="960" height="360" fill="#FFFDF8"/>
  <!-- zones -->
  <rect x="16" y="40" width="584" height="304" rx="8" fill="#F0EADF" stroke="rgba(14,94,87,0.55)" stroke-width="1.2" stroke-dasharray="4,4"/>
  <rect x="288" y="76" width="288" height="252" rx="8" fill="#FFFDF8" stroke="#55606E" stroke-width="1.2"/>
  <!-- zonelabels -->
  <rect x="28" y="31" width="156" height="19" rx="2" fill="#FFFDF8"/>
  <text x="36" y="45" fill="#0E5E57" font-size="15" font-weight="500" font-family="'IBM Plex Mono', Consolas, monospace" letter-spacing="0.1em">YOUR COMPUTER</text>
  <rect x="300" y="67" width="216" height="19" rx="2" fill="#F0EADF"/>
  <text x="308" y="81" fill="#55606E" font-size="15" font-weight="500" font-family="'IBM Plex Mono', Consolas, monospace" letter-spacing="0.1em">ONE FOLDER PER EXAM</text>
  <!-- arrows -->
  <path d="M208,132 H288" fill="none" stroke="#55606E" stroke-width="1.5" marker-end="url(#data-local-arrow)"/>
  <path d="M208,284 H304" fill="none" stroke="#55606E" stroke-width="1.5" marker-end="url(#data-local-arrow)"/>
  <path d="M576,304 H712" fill="none" stroke="#55606E" stroke-width="1.5" stroke-dasharray="5,4"/>
  <path d="M560,208 H712" fill="none" stroke="#3D5A80" stroke-width="1.5" marker-end="url(#data-local-arrow-link)"/>
  <path d="M650,298 L662,310 M662,298 L650,310" stroke="#55606E" stroke-width="1.6" stroke-linecap="round"/>
  <!-- labels -->
  <rect x="212" y="107" width="72" height="19" rx="2" fill="#F0EADF"/>
  <text x="248" y="121.5" fill="#55606E" font-size="15" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">WRITES</text>
  <rect x="212" y="259" width="72" height="19" rx="2" fill="#F0EADF"/>
  <text x="248" y="273.5" fill="#55606E" font-size="15" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">CHECKS</text>
  <rect x="610" y="183" width="92" height="19" rx="2" fill="#FFFDF8"/>
  <text x="656" y="197.5" fill="#3D5A80" font-size="15" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">YOU COPY</text>
  <rect x="614" y="279" width="84" height="19" rx="2" fill="#FFFDF8"/>
  <text x="656" y="293.5" fill="#55606E" font-size="15" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">REFUSED</text>
  <!-- nodes -->
  <rect x="40" y="88" width="168" height="88" rx="6" fill="#FFFDF8" stroke="#1C2430" stroke-width="1.2"/>
  <text x="124" y="114" fill="#1C2430" font-size="18" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" text-anchor="middle">Mizan</text>
  <text x="124" y="138" fill="#55606E" font-size="15" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">no network calls</text>
  <text x="124" y="158" fill="#55606E" font-size="15" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">of its own</text>
  <rect x="40" y="240" width="168" height="88" rx="6" fill="#FFFDF8" stroke="#55606E" stroke-width="1.2"/>
  <text x="124" y="266" fill="#1C2430" font-size="18" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" text-anchor="middle">Private key folder</text>
  <text x="124" y="290" fill="#55606E" font-size="15" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">signing key,</text>
  <text x="124" y="310" fill="#55606E" font-size="15" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">checkpoints</text>
  <rect x="304" y="100" width="256" height="64" rx="6" fill="#FFFDF8" stroke="#1C2430" stroke-width="1.2"/>
  <text x="320" y="124" fill="#1C2430" font-size="18" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif">Scans</text>
  <text x="320" y="148" fill="#55606E" font-size="15" font-family="'IBM Plex Mono', Consolas, monospace">a copy of every scan</text>
  <rect x="304" y="176" width="256" height="64" rx="6" fill="#FFFDF8" stroke="#1C2430" stroke-width="1.2"/>
  <text x="320" y="200" fill="#1C2430" font-size="18" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif">Exports</text>
  <text x="320" y="224" fill="#55606E" font-size="15" font-family="'IBM Plex Mono', Consolas, monospace">results, reports, the key</text>
  <rect x="304" y="252" width="256" height="64" rx="6" fill="#DCEBE6" stroke="#0E5E57" stroke-width="1.2"/>
  <text x="320" y="276" fill="#1C2430" font-size="18" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif">Audit log</text>
  <text x="320" y="300" fill="#55606E" font-size="15" font-family="'IBM Plex Mono', Consolas, monospace">every decision, sealed</text>
  <rect x="712" y="164" width="232" height="88" rx="6" fill="#FFFDF8" stroke="#8C8270" stroke-width="1.2"/>
  <text x="828" y="190" fill="#1C2430" font-size="18" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" text-anchor="middle">Shared by you</text>
  <text x="828" y="214" fill="#55606E" font-size="15" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">grade upload,</text>
  <text x="828" y="234" fill="#55606E" font-size="15" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">course report</text>
  <rect x="712" y="268" width="232" height="72" rx="6" fill="#FFFDF8" stroke="#8C8270" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="828" y="296" fill="#1C2430" font-size="18" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" text-anchor="middle">Cloud or network drive</text>
  <text x="828" y="320" fill="#55606E" font-size="15" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">refused for exams*</text>
</svg>
