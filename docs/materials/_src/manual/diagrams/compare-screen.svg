  <title id="compare-screen-title">The comparison with Remark, as a plan</title>
  <desc id="compare-screen-desc">Plan of the comparison screen: a Restricted banner with Back to results; a row of six tiles, Booklets paired, Questions equal, To adjudicate, Totals equal, Identity and Key sheets; on the left the list Differences to adjudicate with Queue for review and the columns Q, Sheet as scanned, Readings and Status; on the right the cards Identity, totals and key sheets, and Workbooks and report with Report folder and Save report. Every count and answer is left blank.</desc>
