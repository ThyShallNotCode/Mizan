<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 368" width="100%" role="img" aria-labelledby="how-it-works-title how-it-works-desc">
  <title id="how-it-works-title">How Mizan grades an exam</title>
  <desc id="how-it-works-desc">Process in five steps: you scan the sheets and confirm the setup, Mizan reads every mark without seeing the answer key and scores it, you decide each doubtful mark and release the results, and Mizan then writes the reports; every decision is recorded.</desc>
  <defs><marker id="how-it-works-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55606E"/></marker><marker id="how-it-works-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0E5E57"/></marker><marker id="how-it-works-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3D5A80"/></marker></defs>
  <rect width="960" height="368" fill="#FFFDF8"/>
  <!-- zones -->
  <line x1="16" y1="52" x2="944" y2="52" stroke="#E3DACB" stroke-width="1"/>
  <line x1="16" y1="224" x2="944" y2="224" stroke="#E3DACB" stroke-width="1"/>
  <line x1="16" y1="360" x2="944" y2="360" stroke="#E3DACB" stroke-width="1"/>
  <line x1="76" y1="52" x2="76" y2="360" stroke="#E3DACB" stroke-width="1"/>
  <text x="46" y="145" fill="#55606E" font-size="15" font-weight="500" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">YOU</text>
  <text x="46" y="297" fill="#55606E" font-size="15" font-weight="500" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">MIZAN</text>
  <circle cx="164" cy="26" r="14" fill="#F0EADF"/>
  <text x="164" y="31" fill="#1C2430" font-size="15" font-weight="500" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">1</text>
  <circle cx="340" cy="26" r="14" fill="#F0EADF"/>
  <text x="340" y="31" fill="#1C2430" font-size="15" font-weight="500" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">2</text>
  <circle cx="516" cy="26" r="14" fill="#F0EADF"/>
  <text x="516" y="31" fill="#1C2430" font-size="15" font-weight="500" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">3</text>
  <circle cx="692" cy="26" r="14" fill="#F0EADF"/>
  <text x="692" y="31" fill="#1C2430" font-size="15" font-weight="500" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">4</text>
  <circle cx="868" cy="26" r="14" fill="#F0EADF"/>
  <text x="868" y="31" fill="#1C2430" font-size="15" font-weight="500" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">5</text>
  <rect x="428" y="68" width="352" height="140" rx="8" fill="#F0EADF" stroke="rgba(14,94,87,0.55)" stroke-width="1.2" stroke-dasharray="4,4"/>
  <!-- zonelabels -->
  <rect x="440" y="59" width="280" height="19" rx="2" fill="#FFFDF8"/>
  <text x="448" y="73" fill="#0E5E57" font-size="15" font-weight="500" font-family="'IBM Plex Mono', Consolas, monospace" letter-spacing="0.1em">YOU DECIDE · ALL RECORDED</text>
  <!-- arrows -->
  <path d="M240,140 H332 Q340,140 340,148 V240" fill="none" stroke="#55606E" stroke-width="1.5" marker-end="url(#how-it-works-arrow)"/>
  <path d="M416,292 H508 Q516,292 516,284 V192" fill="none" stroke="#55606E" stroke-width="1.5" marker-end="url(#how-it-works-arrow)"/>
  <path d="M592,140 H616" fill="none" stroke="#55606E" stroke-width="1.5" marker-end="url(#how-it-works-arrow)"/>
  <path d="M768,140 H860 Q868,140 868,148 V240" fill="none" stroke="#55606E" stroke-width="1.5" marker-end="url(#how-it-works-arrow)"/>
  <!-- nodes -->
  <rect x="88" y="88" width="152" height="104" rx="6" fill="#FFFDF8" stroke="#1C2430" stroke-width="1.2"/>
  <text x="164" y="122" fill="#1C2430" font-size="18" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" text-anchor="middle">Scan and set up</text>
  <text x="164" y="146" fill="#55606E" font-size="15" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">you give scans,</text>
  <text x="164" y="166" fill="#55606E" font-size="15" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">key and roster</text>
  <rect x="264" y="240" width="152" height="104" rx="6" fill="#FFFDF8" stroke="#1C2430" stroke-width="1.2"/>
  <text x="340" y="274" fill="#1C2430" font-size="18" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" text-anchor="middle">Read and score</text>
  <text x="340" y="298" fill="#55606E" font-size="15" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">reads marks</text>
  <text x="340" y="318" fill="#55606E" font-size="15" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">without the key</text>
  <rect x="440" y="88" width="152" height="104" rx="6" fill="#FFFDF8" stroke="#1C2430" stroke-width="1.2"/>
  <text x="516" y="122" fill="#1C2430" font-size="18" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" text-anchor="middle">Review doubts</text>
  <text x="516" y="146" fill="#55606E" font-size="15" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">see the scan,</text>
  <text x="516" y="166" fill="#55606E" font-size="15" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">then decide</text>
  <rect x="616" y="88" width="152" height="104" rx="6" fill="#FFFDF8" stroke="#1C2430" stroke-width="1.2"/>
  <text x="692" y="122" fill="#1C2430" font-size="18" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" text-anchor="middle">Release results</text>
  <text x="692" y="146" fill="#55606E" font-size="15" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">blocked while</text>
  <text x="692" y="166" fill="#55606E" font-size="15" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">items are open</text>
  <rect x="792" y="240" width="152" height="104" rx="6" fill="#FFFDF8" stroke="#1C2430" stroke-width="1.2"/>
  <text x="868" y="264" fill="#1C2430" font-size="18" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" text-anchor="middle">Export reports</text>
  <text x="868" y="288" fill="#55606E" font-size="15" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">grades, item</text>
  <text x="868" y="308" fill="#55606E" font-size="15" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">analysis and</text>
  <text x="868" y="328" fill="#55606E" font-size="15" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">outcome tables</text>
</svg>
