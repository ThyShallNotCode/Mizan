<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>From a stack of scans to released results</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #FFFDF8;
      --paper-2: #F0EADF;
      --ink: #1C2430;
      --muted: #55606E;
      --soft: #8C8270;
      --rule: rgba(28,36,48,0.14);
      --accent: #0E5E57;
      --font-sans: 'IBM Plex Sans', 'Segoe UI', sans-serif;
      --font-mono: 'IBM Plex Mono', Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
    }
    .frame { max-width: 960px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: clamp(1.4rem, 2vw + 0.8rem, 1.9rem);
      letter-spacing: -0.01em;
      line-height: 1.2;
      color: var(--ink);
      margin-bottom: 0.4rem;
    }
    .sub { color: var(--muted); font-size: 0.95rem; margin-bottom: 1.5rem; max-width: 48rem; }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">How it works · Process</p>
    <h1>From a stack of scans to released results</h1>
    <p class="sub">Mizan does the reading and the arithmetic. Every doubtful mark, and the release itself, is left to you.</p>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" role="img" aria-labelledby="how-it-works-title how-it-works-desc">
      <title id="how-it-works-title">How Mizan grades an exam</title>
      <desc id="how-it-works-desc">Process in five steps: you scan the sheets and confirm the setup, Mizan reads every mark without seeing the answer key and scores it, you decide each doubtful mark and release the results, and Mizan then writes the reports; every decision is recorded.</desc>
      <defs><marker id="how-it-works-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55606E"/></marker><marker id="how-it-works-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0E5E57"/></marker><marker id="how-it-works-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3D5A80"/></marker></defs>
      <rect width="960" height="360" fill="#FFFDF8"/>
      <!-- zones -->
      <line x1="16" y1="48" x2="944" y2="48" stroke="rgba(28,36,48,0.14)" stroke-width="1"/>
      <line x1="16" y1="216" x2="944" y2="216" stroke="rgba(28,36,48,0.14)" stroke-width="1"/>
      <line x1="16" y1="344" x2="944" y2="344" stroke="rgba(28,36,48,0.14)" stroke-width="1"/>
      <line x1="76" y1="48" x2="76" y2="344" stroke="rgba(28,36,48,0.14)" stroke-width="1"/>
      <text x="44" y="144" fill="#55606E" font-size="12" font-weight="500" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">YOU</text>
      <text x="44" y="284" fill="#55606E" font-size="12" font-weight="500" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">MIZAN</text>
      <circle cx="160" cy="24" r="12" fill="rgba(28,36,48,0.07)"/>
      <text x="160" y="28" fill="#1C2430" font-size="12" font-weight="500" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">1</text>
      <circle cx="332" cy="24" r="12" fill="rgba(28,36,48,0.07)"/>
      <text x="332" y="28" fill="#1C2430" font-size="12" font-weight="500" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">2</text>
      <circle cx="504" cy="24" r="12" fill="rgba(28,36,48,0.07)"/>
      <text x="504" y="28" fill="#1C2430" font-size="12" font-weight="500" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">3</text>
      <circle cx="676" cy="24" r="12" fill="rgba(28,36,48,0.07)"/>
      <text x="676" y="28" fill="#1C2430" font-size="12" font-weight="500" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">4</text>
      <circle cx="848" cy="24" r="12" fill="rgba(28,36,48,0.07)"/>
      <text x="848" y="28" fill="#1C2430" font-size="12" font-weight="500" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">5</text>
      <rect x="416" y="64" width="348" height="136" rx="8" fill="#F3F5F0" stroke="rgba(14,94,87,0.55)" stroke-width="1.2" stroke-dasharray="4,4"/>
      <!-- zonelabels -->
      <rect x="428" y="56" width="328" height="16" rx="2" fill="#FFFDF8"/>
      <text x="436" y="68" fill="#0E5E57" font-size="12" font-weight="500" font-family="'IBM Plex Mono', Consolas, monospace" letter-spacing="0.12em">YOU DECIDE · EVERY DECISION RECORDED</text>
      <!-- arrows -->
      <path d="M232,140 H324 Q332,140 332,148 V236" fill="none" stroke="#55606E" stroke-width="1.5" marker-end="url(#how-it-works-arrow)"/>
      <path d="M404,280 H496 Q504,280 504,272 V184" fill="none" stroke="#55606E" stroke-width="1.5" marker-end="url(#how-it-works-arrow)"/>
      <path d="M576,140 H604" fill="none" stroke="#55606E" stroke-width="1.5" marker-end="url(#how-it-works-arrow)"/>
      <path d="M748,140 H840 Q848,140 848,148 V236" fill="none" stroke="#55606E" stroke-width="1.5" marker-end="url(#how-it-works-arrow)"/>
      <!-- nodes -->
      <rect x="88" y="96" width="144" height="88" rx="6" fill="#FFFDF8"/>
      <rect x="88" y="96" width="144" height="88" rx="6" fill="#FFFFFF" stroke="#1C2430" stroke-width="1.2"/>
      <text x="160" y="127" fill="#1C2430" font-size="16" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" text-anchor="middle">Scan and set up</text>
      <text x="160" y="148" fill="#55606E" font-size="12" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">scans, key, roster</text>
      <text x="160" y="164" fill="#55606E" font-size="12" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">you check details</text>
      <rect x="260" y="236" width="144" height="88" rx="6" fill="#FFFDF8"/>
      <rect x="260" y="236" width="144" height="88" rx="6" fill="#FFFFFF" stroke="#1C2430" stroke-width="1.2"/>
      <text x="332" y="267" fill="#1C2430" font-size="16" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" text-anchor="middle">Read and score</text>
      <text x="332" y="288" fill="#55606E" font-size="12" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">reads every mark</text>
      <text x="332" y="304" fill="#55606E" font-size="12" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">without the key</text>
      <rect x="432" y="96" width="144" height="88" rx="6" fill="#F3F5F0"/>
      <rect x="432" y="96" width="144" height="88" rx="6" fill="#FFFFFF" stroke="#1C2430" stroke-width="1.2"/>
      <text x="504" y="127" fill="#1C2430" font-size="16" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" text-anchor="middle">Review doubts</text>
      <text x="504" y="148" fill="#55606E" font-size="12" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">shown as scanned</text>
      <text x="504" y="164" fill="#55606E" font-size="12" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">accept or override</text>
      <rect x="604" y="96" width="144" height="88" rx="6" fill="#F3F5F0"/>
      <rect x="604" y="96" width="144" height="88" rx="6" fill="#FFFFFF" stroke="#1C2430" stroke-width="1.2"/>
      <text x="676" y="127" fill="#1C2430" font-size="16" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" text-anchor="middle">Release results</text>
      <text x="676" y="148" fill="#55606E" font-size="12" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">blocked while</text>
      <text x="676" y="164" fill="#55606E" font-size="12" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">anything is open</text>
      <rect x="776" y="236" width="144" height="88" rx="6" fill="#FFFDF8"/>
      <rect x="776" y="236" width="144" height="88" rx="6" fill="#FFFFFF" stroke="#1C2430" stroke-width="1.2"/>
      <text x="848" y="267" fill="#1C2430" font-size="16" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" text-anchor="middle">Export reports</text>
      <text x="848" y="288" fill="#55606E" font-size="12" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">grades, analysis,</text>
      <text x="848" y="304" fill="#55606E" font-size="12" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">outcome tables</text>
    </svg>
  </div>
</body>
</html>
