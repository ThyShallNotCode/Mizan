<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" role="img" aria-labelledby="data-local-title data-local-desc">
  <title id="data-local-title">Where Mizan keeps your exam data</title>
  <desc id="data-local-desc">Architecture: on your computer, Mizan writes each exam folder (a copy of every scanned page, the exports including the answer key, and a tamper-evident audit log of every decision) and keeps a private key folder that checks the log; Mizan makes no network calls of its own, refuses cloud sync folders and network drives for exams, and exports leave only when you copy them.</desc>
  <defs><marker id="data-local-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55606E"/></marker><marker id="data-local-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0E5E57"/></marker><marker id="data-local-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3D5A80"/></marker></defs>
  <rect width="960" height="560" fill="#FFFDF8"/>
  <!-- zones -->
  <rect x="24" y="40" width="608" height="408" rx="8" fill="#F5F7F2" stroke="rgba(14,94,87,0.55)" stroke-width="1.2" stroke-dasharray="4,4"/>
  <rect x="288" y="72" width="312" height="240" rx="8" fill="#ECEFEA" stroke="#55606E" stroke-width="1.2"/>
  <!-- zonelabels -->
  <rect x="36" y="32" width="132" height="16" rx="2" fill="#FFFDF8"/>
  <text x="44" y="44" fill="#0E5E57" font-size="12" font-weight="500" font-family="'IBM Plex Mono', Consolas, monospace" letter-spacing="0.12em">YOUR COMPUTER</text>
  <rect x="300" y="64" width="244" height="16" rx="2" fill="#F5F7F2"/>
  <text x="308" y="76" fill="#55606E" font-size="12" font-weight="500" font-family="'IBM Plex Mono', Consolas, monospace" letter-spacing="0.12em">EXAM FOLDER · ONE PER EXAM</text>
  <!-- arrows -->
  <path d="M216,216 H288" fill="none" stroke="#55606E" stroke-width="1.5" marker-end="url(#data-local-arrow)"/>
  <path d="M352,352 V296" fill="none" stroke="#55606E" stroke-width="1.5" marker-end="url(#data-local-arrow)"/>
  <path d="M600,288 H704" fill="none" stroke="#55606E" stroke-width="1.5" stroke-dasharray="5,4"/>
  <path d="M584,196 H704" fill="none" stroke="#3D5A80" stroke-width="1.5" marker-end="url(#data-local-arrow-link)"/>
  <path d="M662,282 L674,294 M674,282 L662,294" stroke="#55606E" stroke-width="1.6" stroke-linecap="round"/>
  <!-- labels -->
  <rect x="222" y="192" width="60" height="16" rx="2" fill="#F5F7F2"/>
  <text x="252" y="204" fill="#55606E" font-size="12" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">WRITES</text>
  <rect x="360" y="324" width="60" height="16" rx="2" fill="#F5F7F2"/>
  <text x="390" y="336" fill="#55606E" font-size="12" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">CHECKS</text>
  <rect x="614" y="172" width="76" height="16" rx="2" fill="#FFFDF8"/>
  <text x="652" y="184" fill="#3D5A80" font-size="12" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">YOU COPY</text>
  <rect x="618" y="264" width="68" height="16" rx="2" fill="#FFFDF8"/>
  <text x="652" y="276" fill="#55606E" font-size="12" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">REFUSED</text>
  <!-- nodes -->
  <rect x="56" y="172" width="160" height="88" rx="6" fill="#FFFDF8"/>
  <rect x="56" y="172" width="160" height="88" rx="6" fill="#FFFFFF" stroke="#1C2430" stroke-width="1.2"/>
  <text x="136" y="203" fill="#1C2430" font-size="16" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" text-anchor="middle">Mizan</text>
  <text x="136" y="224" fill="#55606E" font-size="12" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">no network calls</text>
  <text x="136" y="240" fill="#55606E" font-size="12" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">of its own</text>
  <rect x="304" y="96" width="280" height="56" rx="6" fill="#FFFDF8"/>
  <rect x="304" y="96" width="280" height="56" rx="6" fill="#FFFFFF" stroke="#1C2430" stroke-width="1.2"/>
  <text x="320" y="120" fill="#1C2430" font-size="16" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif">Scans</text>
  <text x="320" y="140" fill="#55606E" font-size="12" font-family="'IBM Plex Mono', Consolas, monospace">a copy of every scanned page</text>
  <rect x="304" y="168" width="280" height="56" rx="6" fill="#FFFDF8"/>
  <rect x="304" y="168" width="280" height="56" rx="6" fill="#FFFFFF" stroke="#1C2430" stroke-width="1.2"/>
  <text x="320" y="192" fill="#1C2430" font-size="16" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif">Exports</text>
  <text x="320" y="212" fill="#55606E" font-size="12" font-family="'IBM Plex Mono', Consolas, monospace">results, reports, the answer key</text>
  <rect x="304" y="240" width="280" height="56" rx="6" fill="#FFFDF8"/>
  <rect x="304" y="240" width="280" height="56" rx="6" fill="#DCEBE6" stroke="#0E5E57" stroke-width="1.2"/>
  <text x="320" y="264" fill="#1C2430" font-size="16" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif">Audit log</text>
  <text x="320" y="284" fill="#55606E" font-size="12" font-family="'IBM Plex Mono', Consolas, monospace">every decision, tamper-evident</text>
  <rect x="288" y="352" width="312" height="64" rx="6" fill="#F5F7F2"/>
  <rect x="288" y="352" width="312" height="64" rx="6" fill="rgba(28,36,48,0.05)" stroke="#55606E" stroke-width="1.2"/>
  <text x="304" y="380" fill="#1C2430" font-size="16" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif">Private key folder</text>
  <text x="304" y="400" fill="#55606E" font-size="12" font-family="'IBM Plex Mono', Consolas, monospace">signing key and log checkpoints</text>
  <rect x="704" y="252" width="232" height="72" rx="6" fill="#FFFDF8"/>
  <rect x="704" y="252" width="232" height="72" rx="6" fill="rgba(28,36,48,0.02)" stroke="rgba(28,36,48,0.32)" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="820" y="283" fill="#1C2430" font-size="16" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" text-anchor="middle">Cloud or network drive</text>
  <text x="820" y="304" fill="#55606E" font-size="12" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">refused for exams*</text>
  <rect x="704" y="160" width="232" height="72" rx="6" fill="#FFFDF8"/>
  <rect x="704" y="160" width="232" height="72" rx="6" fill="rgba(28,36,48,0.03)" stroke="rgba(28,36,48,0.30)" stroke-width="1.2"/>
  <text x="820" y="191" fill="#1C2430" font-size="16" font-weight="600" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" text-anchor="middle">Shared by you</text>
  <text x="820" y="212" fill="#55606E" font-size="12" font-family="'IBM Plex Mono', Consolas, monospace" text-anchor="middle">grade upload, course report</text>
  <!-- top -->
  <line x1="24" y1="476" x2="936" y2="476" stroke="rgba(28,36,48,0.14)" stroke-width="1"/>
  <text x="24" y="500" fill="#55606E" font-size="12" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif">* On Windows, so far only network paths and Dropbox-style folders are refused.</text>
  <text x="24" y="520" fill="#55606E" font-size="12" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif">Mizan does not encrypt these folders: keep them on an encrypted disk, and back up both.</text>
  <text x="24" y="540" fill="#8C8270" font-size="12" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif">“No network calls of its own” comes from a review of the program’s code, not from a traffic test.</text>
</svg>
